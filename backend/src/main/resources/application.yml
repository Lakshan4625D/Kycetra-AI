
server:
  port: ${SERVER_PORT:8080}

kyc:
  storage:
    directory: ${KYC_STORAGE_DIR:./uploads/kyc}

kycetra:
  chunking:
    chunk-size: 1000
    chunk-overlap: 150

spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: kycetra-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kycetra}
    username: ${DB_USERNAME:${POSTGRES_USER:kycetra_app}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            model: gemini-embedding-001
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 768

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
