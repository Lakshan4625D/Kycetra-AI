
server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: kycetra-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kycetra}
    username: ${DB_USERNAME:kycetra_app}
    password: ${DB_PASSWORD:local_dev_password_change_me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never